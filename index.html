(function(){var v=document.getElementById('hv'),f=document.getElementById('hvf');if(!v||!f)return;
var tried=false,swapped=false;
function playing(){return !v.paused&&v.currentTime>0&&v.readyState>=2}
function useImg(){if(swapped||playing())return;swapped=true;v.style.display='none';v.pause&&v.pause();f.hidden=false}
function blobRetry(){if(tried)return;tried=true;var src=v.querySelector('source'),u=src&&src.getAttribute('src');if(!u)return;
 fetch(u).then(function(r){return r.blob()}).then(function(b){
  v.removeAttribute('src');while(v.firstChild)v.removeChild(v.firstChild);
  v.src=URL.createObjectURL(new Blob([b],{type:'video/mp4'}));v.muted=true;v.load();
  var p=v.play();if(p&&p.catch)p.catch(function(){})}).catch(function(){})}
v.addEventListener('error',function(){blobRetry();setTimeout(useImg,1500)},true);
setTimeout(function(){if(!playing())blobRetry()},1800);

<script>(function(){
var MAX=1440,MIN=320,b=document.getElementById('site'),fw=null;
var bar=document.getElementById('bar'),tb=document.getElementById('tour'),bd=document.getElementById('bd');
function cap(){return Math.min(MAX,innerWidth)}
function mark(w){
  bd.textContent=Math.round(w)+'px';
  bar.querySelectorAll('button[data-w]').forEach(function(x){
    var t=+x.dataset.w;x.classList.toggle('on',t===1440?w>1100:t===820?(w>700&&w<=1100):w<=700)
  })
}
var sc=1,coarse=matchMedia('(pointer:coarse)').matches;
function fit(){
  var cs=getComputedStyle(document.body),w=b.offsetWidth,h=b.offsetHeight;
  var aw=document.documentElement.clientWidth,ah=innerHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  sc=1;if(w>0)sc=Math.min(1,aw/w);if(!coarse&&h>0)sc=Math.min(sc,ah/h);
  b.style.transformOrigin='50% 0';
  if(sc<1){b.style.transform='scale('+sc+')';b.style.marginBottom=(h*(sc-1))+'px';b.style.marginLeft=b.style.marginRight=(w*(sc-1)/2)+'px'}
  else{b.style.transform='';b.style.marginBottom=b.style.marginLeft=b.style.marginRight=''}
}
function set(w){w=Math.max(MIN,Math.min(MAX,Math.round(w)));fw=w;b.style.width=w+'px';b.style.maxWidth='none';window.__apply(w);mark(w);fit()}
function reset(){fw=null;b.style.width='';b.style.maxWidth='';window.__apply(cap());mark(cap());fit()}

/* animated presets + tour */
var raf=0,tid=0,touring=false;
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=0;clearTimeout(tid);tid=0}
function stopTour(){touring=false;stopAnim();tb.textContent='▶ Tour';tb.setAttribute('aria-label','Play size tour')}
function glide(to,dur,done){
  stopAnim();to=Math.min(to,MAX);
  var from=b.offsetWidth;
  if(RM||Math.abs(to-from)<2){set(to);if(to>=cap()&&cap()>=MAX)reset();if(done)done();return}
  var t0=performance.now();
  (function step(now){
    var p=Math.min(1,(now-t0)/dur);set(from+(to-from)*ease(p));
    if(p<1){raf=requestAnimationFrame(step)}else{raf=0;if(to>=cap()&&cap()>=MAX)reset();if(done)done()}
  })(t0)
}
bar.querySelectorAll('button[data-w]').forEach(function(x){
  x.addEventListener('click',function(){stopTour();glide(+x.dataset.w,750)})
});
var seq=[820,390,1440],si=0;
function next(){if(!touring)return;glide(seq[si],900,function(){si=(si+1)%seq.length;tid=setTimeout(next,1500)})}
tb.addEventListener('click',function(){
  if(touring){stopTour();return}
  touring=true;si=0;tb.textContent='■ Stop';tb.setAttribute('aria-label','Stop size tour');next()
});

/* drag either edge: the page stays centred, so width changes by 2x the pointer movement */
document.querySelectorAll('.grip').forEach(function(g){
  var dir=g.classList.contains('r')?1:-1,x0=0,w0=0;
  g.addEventListener('pointerdown',function(e){
    e.preventDefault();stopTour();g.setPointerCapture(e.pointerId);
    x0=e.clientX;w0=b.offsetWidth;g.classList.add('on');
    document.querySelectorAll('.grip').forEach(function(q){q.classList.add('seen')});
    set(w0)
  });
  g.addEventListener('pointermove',function(e){if(g.classList.contains('on'))set(w0+dir*2*(e.clientX-x0)/sc)});
  function end(){g.classList.remove('on')}
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',reset)
});

window.addEventListener('resize',function(){if(fw===null){window.__apply(cap());mark(cap())}else{fit()}});
mark(cap());fit();
window.addEventListener('resize',fit);window.addEventListener('load',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(b);
})();
<\/script>
<script>(function(){
function group(sel,cb){var els=[].slice.call(document.querySelectorAll(sel));els.forEach(function(b){b.addEventListener('click',function(){els.forEach(function(x){x.setAttribute('aria-checked',x===b?'true':'false')});if(cb)cb(b)})})}
group('.sz',function(b){document.getElementById('pr').textContent=b.dataset.p;var w=document.getElementById('was');w.textContent=b.dataset.w;w.hidden=!b.dataset.w});
group('.opt');
var q=1,n=document.getElementById('qn');
document.getElementById('qm').onclick=function(){q=Math.max(1,q-1);n.textContent=q};
document.getElementById('qp').onclick=function(){q=Math.min(99,q+1);n.textContent=q};

<script>
(function(){
var html=document.getElementById('src').textContent.replace(/<\\\/script/g,'</script');
var inject='<style>.bar,.grip{display:none!important}body{padding:0!important;margin:0!important}html{background:#fff!important;display:block!important;min-height:0!important}</style>'
+'<script>Object.defineProperty(window,"innerHeight",{get:function(){return 100000},configurable:true});'
+'addEventListener("keydown",function(e){if(e.key==="ArrowLeft"||e.key==="ArrowRight")parent.postMessage({k:e.key},"*")});<\/script>';
html=html.replace(/<head>/i,'<head>'+inject);

var D=[{k:'computer',n:'Computer',b:22,sw:1440,sh:900,box:[1724,990],m:1},
       {k:'ipad',n:'iPad',b:26,sw:1180,sh:820,box:[1232,872],m:1},
       {k:'phone',n:'iPhone',b:14,sw:390,sh:844,box:[418,872],m:.79}]; /* m: real-world size relative to the laptop and iPad (iPhone screen is about 6.5 cm wide vs 23-30 cm) */
var stage=document.getElementById('stage');
D.forEach(function(d,i){
 var s=document.createElement('div');s.className='slot';
 var extra=d.k==='computer'?'<div class="base"></div>':'';
 var inner=d.k==='phone'?'<div class="statusbar"><span>9:41</span><i>\u25cf\u25cf\u25cf \u25ae</i></div>':'';
 var top=d.k==='phone'?'<div class="island"></div>':'<div class="cam"></div>';
 if(d.k==='computer')s.classList.add('computer-slot');
 s.innerHTML='<div class="gshadow"></div><div class="device '+d.k+'">'+top+'<div class="screen" style="inset:'+d.b+'px">'+inner+'<iframe title="'+d.n+' preview" allow="autoplay"></iframe>'+(d.k==='computer'?'':'<div class="homebar"></div>')+'</div>'+extra+'<div class="hit" hidden></div></div>';
 s.style.width=(d.sw+2*d.b)+'px';s.style.height=(d.sh+2*d.b)+'px';
 stage.appendChild(s);d.slot=s;d.hit=s.querySelector('.hit');d.fr=s.querySelector('iframe');d.fr.srcdoc=html;
 d.hit.onclick=function(e){e.stopPropagation();goTo(i)};
});
var pos=0,target=0,raf=0,tm=0;
function mod(n){return ((n%3)+3)%3}
/* only while the iPhone is in front: iPad nudges left, laptop nudges right */
function spread(d){
 if(d.k==='phone')return 0;
 var dp=((2-pos+1.5)%3+3)%3-1.5,w=Math.max(0,1-Math.abs(dp));w=w*w*(3-2*w);
 return (d.k==='ipad'?-1:1)*36*w;
}
function render(){
 var W=stage.clientWidth,H=stage.clientHeight-16,front=mod(Math.round(pos));
 var S=Math.min(.8*W/1724,H*.94/990,1); /* one shared scale, so sizes stay true to each other */
 D.forEach(function(d,i){
  var a=(i-pos)*2*Math.PI/3,c=Math.cos(a),t=Math.max(0,Math.min(1,(c+.5)/1.5));
  var e=t*t*(3-2*t),s=S*d.m*(.6+.4*e);
  var x=Math.sin(a)/.866*(W/2-74-(d.sw+2*d.b)*S*d.m*.3)+spread(d),y=-(1-e)*.04*H-(d.k==='computer'?20*s:0);
  d.slot.style.transform='translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) scale('+s.toFixed(4)+')';
  d.slot.style.zIndex=Math.round(t*10)+1;
  d.slot.style.opacity=(.82+.18*e).toFixed(2);
  d.hit.hidden=i===front;
  d.fr.style.pointerEvents=i===front?'auto':'none';
 });
}
function animate(){
 cancelAnimationFrame(raf);var from=pos,to=target,t0=performance.now(),dur=1000;
 (function step(now){var p=Math.min(1,(now-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;pos=from+(to-from)*e;render();
  if(p<1)raf=requestAnimationFrame(step);else{pos=to;render();schedule()}})(t0);
}
/* autoplay is always on; any manual move restarts the wait before the next turn */
function schedule(){clearTimeout(tm);tm=setTimeout(function(){target+=1;animate()},4200)}
function step(n){target=Math.round(target)+n;animate()}
function goTo(i){var d=mod(i-mod(target));if(d===0)return;step(d===2?-1:1)}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
function key(k){if(k==='ArrowLeft')step(-1);if(k==='ArrowRight')step(1)}
addEventListener('keydown',function(e){key(e.key)});
addEventListener('message',function(e){if(e.data&&e.data.k)key(e.data.k)});
var x0=null;stage.addEventListener('pointerdown',function(e){x0=e.clientX});
stage.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>80)step(dx<0?1:-1)});
addEventListener('resize',render);
render();schedule();
})();
</script>
